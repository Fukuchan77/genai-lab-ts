# Dependabot (spec 001, requirements 10.11 and 10.12). Weekly version updates for npm dependencies and
# GitHub Actions. Tools pinned in mise.toml are not covered; check them with `mise run outdated`.
#
# `cooldown` keeps version updates to releases at least a day old, matching pnpm's minimumReleaseAge.
# It does not apply to security updates: merge those only after the fixed version is 24 hours old.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    commit-message:
      prefix: "build"
      include: "scope"
    # One pull request a week for every npm update, rather than one per package.
    groups:
      npm:
        patterns:
          - "*"
    # TypeScript stays on the 7.1 beta until a 7.1 RC or stable is published (research.md R-7). The
    # nightly builds on npm's `next` tag (7.1.0-dev.YYYYMMDD.N) sort between beta and rc, so this range
    # skips them and still lets an RC or stable through.
    ignore:
      - dependency-name: "typescript"
        versions: [">= 7.1.0-dev, < 7.1.0-rc"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    commit-message:
      prefix: "build"
      include: "scope"
